name: deployment workflow
on: push
jobs:
  demo-job:
    runs-on: ubuntu-latest
    steps:
      - name: print hello
        run: echo "hello there"
  test:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v5
      - name: download dependencies
        run: npm ci
      - name: test
        run: npm test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v5
      - name: download dependencies
        run: npm ci
      - name: build
        run: npm run build
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: get-artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
      - name: print artifact files
        run: |
          ls dist-files
          echo "deploying"
